schema_version: "1.0"

instance:
  case_id: "tsa29mini"
  instance_root: "."

runtime:
  run_config: "config/run_profile.case_template.yaml"
  tipsy_config_dir: "config/tipsy"
  patchworks_config: "config/patchworks.runtime.windows.yaml"
  log_dir: "runtime/logs"
  baseline_unexpected_diff_threshold: 0

# Notes:
# This instance is a spatial subset of the full TSA29 model.
# Stage 00 (VRI prep) and Stage 01 (VDYP/TIPSY growth) are skipped —
# the compiled yield curves and fragment geometry are already present.
# The model is ready for Patchworks export and scenario runs.
# Pre-compiled fragments.shp IS the Patchworks output — no re-export needed.

steps:
  - step_id: "validate_case"
    kind: "femic_command"
    command: "femic prep validate-case --run-config ${runtime.run_config}"
    required: false
    depends_on: []
    mutable_artifacts: []
    expected_outputs:
      - "case preflight success signal"
    notes: "Skip for ready-to-use instances — pre-compiled data is already validated"
  - step_id: "geospatial_preflight"
    kind: "femic_command"
    command: "femic prep geospatial-preflight"
    required: false
    depends_on:
      - "validate_case"
    mutable_artifacts: []
    expected_outputs:
      - "geospatial runtime success signal"
    notes: "Skip for ready-to-use instances — pre-compiled data is already validated"
  - step_id: "export_patchworks"
    kind: "femic_command"
    command: "femic export patchworks --tsa 29 --bundle-dir data/model_input_bundle --checkpoint data/tsr/strict_chain/23_thlb_parent_023_future_roads.feather --output-dir output/patchworks_tsa29mini"
    required: false
    depends_on: []
    mutable_artifacts:
      - "output/patchworks_tsa29mini/*"
    expected_outputs:
      - "output/patchworks_tsa29mini/forestmodel.xml"
      - "output/patchworks_tsa29mini/fragments/*"
    notes: "Pre-compiled fragments.shp already present in data/ — export is optional for validation only"

invariants:
  - invariant_id: "accounts_targets_presence"
    severity: "fatal"
    metric: "accounts.targets.required_present"
    comparator: "eq"
    target: true
    remediation: "Re-run matrix build and inspect accounts.csv/protoaccounts.csv."
  - invariant_id: "managed_area_sanity"
    severity: "fatal"
    metric: "managed_area_ha"
    comparator: "gt"
    target: 0
    remediation: "Check IFM assignment logic and source checkpoint inputs."
  - invariant_id: "block_join_consistency"
    severity: "fatal"
    metric: "block_join_mismatch_count"
    comparator: "eq"
    target: 0
    remediation: "Rebuild blocks.shp and verify BLOCK join keys."
